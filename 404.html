<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | ARTS CENTER</title>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <link href="style.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

    <style>
      .error-section {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        padding: 40px 20px;
      }

      .error-code {
        font-family: 'Georgia', serif;
        font-size: 120px;
        color: #00abf0;
        margin-bottom: 0;
        letter-spacing: 4px;
      }

      .error-message {
        font-family: 'Arial', sans-serif;
        font-size: 24px;
        color: var(--text-color);
        margin-bottom: 10px;
      }

      .error-description {
        font-family: 'Arial', sans-serif;
        font-size: 16px;
        color: var(--text-color);
        opacity: 0.7;
        margin-bottom: 30px;
      }

      .error-section .btn-primary {
        background-color: black;
        color: white;
        padding: 10px 40px;
        font-size: 18px;
        border-radius: 24px;
        box-shadow: 0 2px 4px var(--box-shadow-color);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .error-section .btn-primary:hover {
        background-color: #003f5c;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg" style="position: fixed; top: 0;">
      <div class="container-fluid">
        <p class="navbar-brand fs-6 fw-bold">
          <div class="spinner-grow mr-1 spin" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          ARTS CENTER
        </p>
      </div>
    </nav>

    <div id="particles-js"></div>

    <section class="error-section">
      <h1 class="error-code">404</h1>
      <h2 class="error-message">Page Not Found</h2>
      <p class="error-description">The page you're looking for doesn't exist or has been moved.</p>
      <a href="index.html" class="btn btn-primary">Back to Home</a>
    </section>

    <button class="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme" onclick="toggleTheme()">
      <span class="material-symbols-outlined">contrast</span>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
